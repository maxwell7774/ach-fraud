# Deployment stack for the ACH fraud pre-processor.
#
# Prereqs:
#   - push the image from CI (see .gitea/workflows/build.yml), or build it
#     locally:  docker build -t ${IMAGE} .
#   - provide .achfraudconfig.json with:
#       * db_url pointing at the postgres service, e.g.
#           "db_url": "postgres://ach:CHANGE_ME@postgres:5432/ach_fraud?sslmode=disable"
#       * the runtime dirs as relative paths (they resolve under /app):
#           input_files / artifact_store / outgoing_files
#   - run migrations once before first boot:
#       make migrate-up   (against the compose DB)
#     or via goose image (see README note).
#
# Usage:
#   cp .env.example .env   # set POSTGRES_PASSWORD and IMAGE
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ach_fraud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ach -d ach_fraud"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ${IMAGE:?set IMAGE in .env}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:8090"
    volumes:
      - ./.achfraudconfig.json:/app/.achfraudconfig.json:ro
      - artifact_store:/app/artifact_store
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${IMAGE:?set IMAGE in .env}
    restart: unless-stopped
    command: ["sh", "-c", "while true; do ach run; sleep 60; done"]
    volumes:
      - ./.achfraudconfig.json:/app/.achfraudconfig.json:ro
      - input_files:/app/input_files
      - artifact_store:/app/artifact_store
      - outgoing_files:/app/outgoing_files
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot schema migrations, self-contained in the image (ach migrate).
  # Runs on every `up` but is idempotent, or run it explicitly:
  #   docker compose run --rm migrate
  migrate:
    image: ${IMAGE:?set IMAGE in .env}
    command: ["ach", "migrate"]
    volumes:
      - ./.achfraudconfig.json:/app/.achfraudconfig.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  input_files:
  artifact_store:
  outgoing_files:
