name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    # Run the Go checks inside the golang image instead of actions/setup-go@v5,
    # which can hang on Gitea's act_runner.
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      - uses: actions/checkout@v4

      - name: fmt
        run: make fmt
      - name: vet
        run: make vet
      - name: lint
        run: make lint
      - name: test
        run: make test

  verify-web:
    runs-on: ubuntu-latest
    container: oven/bun:1
    steps:
      - name: install git (for checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4

      - name: install deps
        run: bun install
      - name: typecheck
        run: bun run typecheck
      - name: build
        run: bun run build

  publish:
    # Push the image to the Gitea container registry on main and version tags.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [verify, verify-web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ gitea.server_url }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ gitea.server_url }}/${{ gitea.repository }}:latest
            ${{ gitea.server_url }}/${{ gitea.repository }}:${{ gitea.ref_name }}
